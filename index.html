    <script>
      (function () {
        if (typeof globalThis === 'undefined') {
          if (typeof window !== 'undefined') window.globalThis = window;
          else if (typeof self !== 'undefined') self.globalThis = self;
        }
        if (typeof window !== 'undefined') {
          window.AudioContext = window.AudioContext || window.webkitAudioContext || null;
        }
        if (typeof navigator !== 'undefined') {
          if (!navigator.mediaDevices) navigator.mediaDevices = {};
          if (!navigator.mediaDevices.getUserMedia) {
            var legacyGetUserMedia =
              navigator.getUserMedia ||
              navigator.webkitGetUserMedia ||
              navigator.mozGetUserMedia ||
              navigator.msGetUserMedia;
            if (legacyGetUserMedia) {
              navigator.mediaDevices.getUserMedia = function (constraints) {
                return new Promise(function (resolve, reject) {
                  legacyGetUserMedia.call(navigator, constraints, resolve, reject);
                });
              };
            }
          }
        }
        if (typeof Object.assign !== 'function') {
          Object.assign = function (target) {
            if (target == null) throw new TypeError('Cannot convert undefined or null to object');
            var to = Object(target);
            for (var i = 1; i < arguments.length; i++) {
              var nextSource = arguments[i];
              if (nextSource != null) {
                for (var nextKey in nextSource) {
                  if (Object.prototype.hasOwnProperty.call(nextSource, nextKey)) {
                    to[nextKey] = nextSource[nextKey];
                  }
                }
              }
            }
            return to;
          };
        }
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // Single unified worker: offline PWA shell + FCM background push
          navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })
            .then(function (reg) {
              console.log('[PWA] Service Worker active:', reg.scope);
              setInterval(function () {
                try { reg.update(); } catch (e) {}
              }, 30 * 60 * 1000);
              reg.addEventListener('updatefound', function () {
                var nw = reg.installing;
                if (!nw) return;
                nw.addEventListener('statechange', function () {
                  if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] Update ready');
                  }
                });
              });
            })
            .catch(function (err) {
              console.warn('[PWA] SW registration failed, trying offline fallback:', err);
              navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
            });
        });
      }
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
    </script>
