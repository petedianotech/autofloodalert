name: Restore App.tsx Once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-app-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore App.tsx if truncated
        run: |
          node scripts/restore-app.mjs
          if git diff --quiet -- src/App.tsx; then
            echo "App.tsx already healthy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "restore: src/App.tsx full source (auto from known-good commit)"
          git push
