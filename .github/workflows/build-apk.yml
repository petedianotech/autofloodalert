name: Build Android APK (Free)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  build:
    name: Build Auto Flood Alert APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            # Ensure platform and build-tools for compileSdk 35 are available
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: Build Web Application & Assets
        run: |
          npm run build
          node scripts/generate-android-assets.js

      - name: Sync Native Android Assets
        run: |
          npx cap sync android

      - name: Ensure Google Services & Resources Exist
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "Generating fallback google-services.json..."
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "158763014091",
              "project_id": "automatic-flood-alert",
              "storage_bucket": "automatic-flood-alert.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:158763014091:android:9d45e4517b620b7237084e",
                  "android_client_info": {
                    "package_name": "com.dzenjecdsstem.floodalert"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "158763014091-74pp71vgs0q81v8u19m9u9f7rk4ha160.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDsh5VHm1rk4tiacIYVkkxZF3LK5lPmH0w"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Compile and Package APK
        run: |
          cd android
          # Ensure gradle-wrapper.jar exists by generating it with the active gradle CLI
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Auto-Flood-Alert.apk
          else
            find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/Auto-Flood-Alert.apk \;
          fi

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Flood-Alert-APK
          path: build-output/Auto-Flood-Alert.apk
          retention-days: 30
